<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="New jobs from LinkedIn, job boards and company career pages, in one list, the moment they're posted. A CV made for each in one tap, made to pass official ATS checks. Free to start."
    />
    <title>Mahoraga · The job search that runs itself</title>
    <!-- What makes the site an app a phone installs, and lets an iPhone add it to its home screen, which Web
         Push there requires. Its icons are the brand kit's (`branding/build.py` writes them here). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The wheel, in the purple (`src/wheel.tsx` draws the same mark). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Before first paint, deliberately. A React effect runs after the first frame, so a
      // dark-mode viewer would see one white flash on every single load.
      (function () {
        try {
          // Dark is the default; light is a choice, kept under the same key `theme.tsx` writes.
          var choice = localStorage.getItem("theme");
          if (choice !== "light" && choice !== "dark") choice = "dark";
          document.documentElement.setAttribute("data-theme", choice);
        } catch (e) {
          /* Private mode, or storage disabled. The CSS default is dark anyway. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
