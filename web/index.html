<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- To the screen's edges, so the tab bar reaches the foot of a phone and keeps clear of what is there
         (`env(safe-area-inset-bottom)`); the phone's own bars take the page's colour (`theme.tsx` paintBars). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1013" />
    <meta
      name="description"
      content="New jobs from LinkedIn, job boards and company career pages, the moment they're posted. A CV for each, made to pass official ATS checks. Free to start."
    />
    <title>Mahoraga</title>
    <!-- What makes the site an app a phone installs, and lets an iPhone add it to its home screen, which Web
         Push there requires. Its icons are the brand kit's (`branding/build.py` writes them here). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The wheel, in the purple (`src/wheel.tsx` draws the same mark). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The theme, before first paint, deliberately: a React effect runs after the first frame, so a
         dark-mode viewer would see one white flash on every single load. A file of its own, not written
         here: the site allows no script that is not one of its files (`services/api/guard.py`). -->
    <script src="/theme.js"></script>
    <meta name="msvalidate.01" content="F13C55FDC1EF26BEF5BA80972F4753AF" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
