<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mahoraga finds jobs for you. Choose the words you want and the words you don't, and it checks job boards every 15 minutes. Any job is one tap from a CV and cover letter made for it."
    />
    <title>Mahoraga</title>
    <!-- What lets an iPhone add the site to its home screen, which Web Push there requires. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Before first paint, deliberately. A React effect runs after the first frame, so a
      // dark-mode viewer would see one white flash on every single load.
      (function () {
        try {
          // Dark is the brand default (the landing page is dark-only); light is a choice.
          var choice = localStorage.getItem("theme");
          if (choice !== "light" && choice !== "dark") choice = "dark";
          document.documentElement.setAttribute("data-theme", choice);
        } catch (e) {
          /* Private mode, or storage disabled. The CSS default is dark anyway. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
