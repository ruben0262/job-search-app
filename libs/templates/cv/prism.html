<!DOCTYPE html>
<!--
  PRISM: a CV template (libs/templates/README.md). Only the <head> is used; the CV is written into the
  body when it is made. Marketing, media, design and hospitality: the name in one band of colour, which
  is as far as research says a CV's colour should go. One column under it, so it reads as easily as any.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prism</title>
<style>
@page { size: A4; margin: 14mm 16mm 15mm 16mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Lato, 'Liberation Sans', Arial, sans-serif;
  font-size: 10pt;
  color: #22223b;
  line-height: 1.34;
}

a { color: inherit; text-decoration: none; }

.cv-header { background: #5b21b6; color: #fff; padding: 8mm 8mm 6mm; border-radius: 3mm; }
.cv-name { font-size: 26pt; font-weight: 900; letter-spacing: 0.4pt; line-height: 1; }
.cv-contact { margin-top: 5pt; font-size: 9pt; color: #ede9fe; display: flex; column-gap: 12pt; }
.header-rule { border: none; margin: 0 0 8pt; }

.profile { font-size: 10.5pt; margin-bottom: 2pt; }

.section { margin-top: 10pt; }
.section-title {
  font-size: 11pt;
  font-weight: 900;
  color: #5b21b6;
  text-transform: uppercase;
  letter-spacing: 0.8pt;
  margin-bottom: 5pt;
}
.section-title::after { content: ""; display: block; width: 16mm; height: 2pt; background: #c4b5fd; margin-top: 2pt; }

.entry { break-inside: avoid; page-break-inside: avoid; margin-bottom: 6pt; }
.entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8pt; }
.entry-title { font-weight: 700; flex: 1; line-height: 1.2; }
.entry-date { font-size: 9pt; color: #5b21b6; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.entry-desc { margin-top: 1pt; }

.entry ul, .section > ul, .plain-list { padding-left: 12pt; margin-top: 2pt; }
li { margin-bottom: 1.5pt; }
li::marker { color: #7c3aed; }
</style>
</head>
<body></body>
</html>
