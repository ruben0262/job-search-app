<!DOCTYPE html>
<!--
  QUILL: a CV template (libs/templates/README.md). Only the <head> is used; the CV is written into the
  body when it is made. Research, universities and teaching: an academic CV, longer than most, each
  heading out at the margin over its section, the section indented under it, and a book face.

  Nothing sits beside anything else. The headings were in the margin beside their sections, first floated
  (Chrome painted them before the text around them, so they reached the PDF ahead of the name) and then
  in a grid column (2026-11-07). Two of five PDF readers, poppler and pdfminer, took that column for a
  column of text: every heading after the first was read apart from its section, and at 0.9pt of
  tracking on 9pt split into "E DUC AT I O N" (2026-11-08).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quill</title>
<style>
@page { size: A4; margin: 19mm 20mm 18mm 20mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Caladea, Cambria, Georgia, serif;
  font-size: 10.5pt;
  color: #1a1a1a;
  line-height: 1.36;
}

a { color: #7c2d12; text-decoration: none; }

.cv-name { font-size: 22pt; font-weight: 700; letter-spacing: 0.4pt; line-height: 1.05; }
.cv-contact { margin-top: 3pt; font-size: 9.5pt; color: #444; display: flex; }
.cv-contact span + span::before { content: "·"; margin: 0 5pt; color: #999; }
.header-rule { border: none; border-top: 0.5pt solid #999; margin: 7pt 0 8pt; }

.profile { margin-left: 34mm; margin-bottom: 2pt; }

.section { margin-top: 9pt; padding-left: 34mm; }
.section-title {
  margin: 0 0 3pt -34mm;
  font-size: 9pt;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5pt;
  color: #7c2d12;
}

.entry { break-inside: avoid; page-break-inside: avoid; margin-bottom: 5pt; }
.entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8pt; }
.entry-title { font-weight: 700; flex: 1; line-height: 1.22; }
.entry-date { font-style: italic; color: #444; white-space: nowrap; flex-shrink: 0; }
.entry-desc { margin-top: 1pt; }

.entry ul, .section > ul { padding-left: 13pt; margin-top: 2pt; }
li { margin-bottom: 1.5pt; }
</style>
</head>
<body></body>
</html>
