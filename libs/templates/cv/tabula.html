<!DOCTYPE html>
<!--
  TABULA: a CV template (libs/templates/README.md). Only the <head> is used; the CV is written into the
  body when it is made. Plain and orderly, for engineering, finance, government and the trades: Carlito,
  a deep blue, each heading in a pale band, and each entry's dates at the right of its line.

  The dates were in a column on the left, as the German tabular CV has them, until the owner put every
  look's dates at the right (2026-11-08). An entry with no dates had its title slide into that column.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tabula</title>
<style>
@page { size: A4; margin: 18mm 18mm 16mm 18mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Carlito, Calibri, 'Liberation Sans', Arial, sans-serif;
  font-size: 10.5pt;
  color: #1f2933;
  line-height: 1.35;
}

a { color: #1f4e79; text-decoration: none; }

.cv-name { font-size: 24pt; font-weight: 700; color: #1f4e79; line-height: 1.05; }
.cv-contact { margin-top: 4pt; font-size: 9.5pt; color: #3e4c59; display: flex; column-gap: 12pt; }
.header-rule { border: none; border-top: 2pt solid #1f4e79; margin: 6pt 0 8pt; }

.profile { margin-bottom: 3pt; }

.section { margin-top: 10pt; }
.section-title {
  font-size: 11.5pt;
  font-weight: 700;
  color: #1f4e79;
  background: #e8eef5;
  padding: 2pt 5pt;
  margin-bottom: 5pt;
}

.entry { break-inside: avoid; page-break-inside: avoid; margin-bottom: 6pt; }
.entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8pt; }
.entry-title { font-weight: 700; flex: 1; line-height: 1.25; }
.entry-date { font-size: 9.5pt; color: #3e4c59; white-space: nowrap; flex-shrink: 0; }
.entry-desc { margin-top: 1pt; }

.entry ul, .section > ul { padding-left: 12pt; margin-top: 2pt; }
li { margin-bottom: 1.5pt; }
</style>
</head>
<body></body>
</html>
