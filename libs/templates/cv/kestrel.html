<!DOCTYPE html>
<!--
  KESTREL: a CV template (libs/templates/README.md). Only the <head> is used; the CV is written into the
  body when it is made. Tech, data and product: compact and modern, the name and the contact line on one
  row, small spaced capitals for headings, dates in grey on the right, one cyan for the marks.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kestrel</title>
<style>
@page { size: A4; margin: 15mm 17mm 14mm 17mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Carlito, Calibri, 'Liberation Sans', Arial, sans-serif;
  font-size: 10.5pt;
  color: #1e293b;
  line-height: 1.3;
}

a { color: #0e7490; text-decoration: none; }

.cv-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2pt 14pt; }
.cv-name { font-size: 23pt; font-weight: 700; color: #0f172a; letter-spacing: -0.2pt; line-height: 1.05; }
.cv-contact { font-size: 9.5pt; color: #475569; display: flex; }
.cv-contact span + span::before { content: "·"; margin: 0 5pt; color: #94a3b8; }
.header-rule { border: none; border-top: 1pt solid #e2e8f0; margin: 6pt 0 7pt; }

.profile { margin-bottom: 2pt; }

.section { margin-top: 9pt; }
.section-title {
  font-size: 9pt;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8pt;
  color: #0e7490;
  margin-bottom: 4pt;
}

.entry { break-inside: avoid; page-break-inside: avoid; margin-bottom: 6pt; }
.entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8pt; }
.entry-title { font-weight: 700; color: #0f172a; flex: 1; line-height: 1.2; }
.entry-date { font-size: 9.5pt; color: #64748b; white-space: nowrap; flex-shrink: 0; }
.entry-desc { color: #334155; margin-top: 1pt; }

.entry ul, .section > ul, .plain-list { padding-left: 11pt; margin-top: 2pt; }
li { margin-bottom: 1.5pt; }
li::marker { color: #0e7490; }
</style>
</head>
<body></body>
</html>
