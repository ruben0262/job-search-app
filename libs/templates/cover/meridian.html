<!DOCTYPE html>
<!--
  MERIDIAN: a cover letter template (libs/templates/README.md). Only the <head> is used; the letter is
  written into the body when it is made. The Meridian CV's header over a British block letter: the
  company, a bold subject line, the letter, the sign-off. No date: a letter carries none of its own
  (owner, 2026-11-08).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover letter</title>
<style>
@page { size: A4; margin: 20mm 22mm 18mm 22mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Lato, Arial, sans-serif;
  font-size: 10.5pt;
  color: #222;
  line-height: 1.45;
}

a { color: #003399; text-decoration: none; }

.cv-name { font-size: 26pt; font-weight: 900; color: #003399; line-height: 1; letter-spacing: 0.3pt; }
.cv-contact { font-size: 9pt; color: #555; margin-top: 4pt; display: flex; column-gap: 10pt; }
.header-rule { border: none; border-top: 1.5pt solid #003399; margin: 6pt 0 14pt; }

.letter-meta { display: flex; flex-direction: column; gap: 8pt; margin-bottom: 12pt; }
.letter-meta p { margin: 0; }
.letter-subject { font-weight: 700; margin-bottom: 12pt; }

p, ul { margin: 0 0 9pt; }
ul { padding-left: 14pt; }
li { margin-bottom: 3pt; }
.closing { margin-top: 14pt; margin-bottom: 2pt; }
.signature { font-weight: 700; }
</style>
</head>
<body></body>
</html>
