<!DOCTYPE html>
<!--
  PRISM: a cover letter template (libs/templates/README.md). Only the <head> is used; the letter is
  written into the body when it is made. The Prism CV's band of colour with the name in it, then the
  company and the date on one line, and the letter.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover letter</title>
<style>
@page { size: A4; margin: 14mm 18mm 18mm 18mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Lato, 'Liberation Sans', Arial, sans-serif;
  font-size: 10.5pt;
  color: #22223b;
  line-height: 1.48;
}

a { color: inherit; text-decoration: none; }

.cv-header { background: #5b21b6; color: #fff; padding: 8mm 8mm 6mm; border-radius: 3mm; }
.cv-name { font-size: 26pt; font-weight: 900; letter-spacing: 0.4pt; line-height: 1; }
.cv-contact { margin-top: 5pt; font-size: 9pt; color: #ede9fe; display: flex; flex-wrap: wrap; column-gap: 12pt; }
.cv-contact span { overflow-wrap: anywhere; }
.header-rule { border: none; margin: 0 0 14pt; }

.letter-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 12pt; margin-bottom: 12pt; }
.letter-meta p { margin: 0; }
.letter-date, .date-line { color: #5b21b6; font-weight: 700; white-space: nowrap; }
.letter-subject { font-weight: 900; color: #5b21b6; margin-bottom: 12pt; }

p, ul { margin: 0 0 9pt; }
ul { padding-left: 13pt; }
li { margin-bottom: 3pt; }
li::marker { color: #7c3aed; }
.closing { margin-top: 14pt; margin-bottom: 2pt; }
.signature { font-weight: 900; color: #5b21b6; }
</style>
</head>
<body></body>
</html>
