<!DOCTYPE html>
<!--
  KESTREL: a cover letter template (libs/templates/README.md). Only the <head> is used; the letter is
  written into the body when it is made. The Kestrel CV's header, then the company and the date on one
  line, the subject in small spaced capitals, and a short letter.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover letter</title>
<style>
@page { size: A4; margin: 18mm 20mm 17mm 20mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Carlito, Calibri, 'Liberation Sans', Arial, sans-serif;
  font-size: 11pt;
  color: #1e293b;
  line-height: 1.45;
}

a { color: #0e7490; text-decoration: none; }

.cv-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2pt 14pt; }
.cv-name { font-size: 23pt; font-weight: 700; color: #0f172a; letter-spacing: -0.2pt; line-height: 1.05; }
.cv-contact { font-size: 9.5pt; color: #475569; display: flex; flex-wrap: wrap; }
.cv-contact span { overflow-wrap: anywhere; }
.cv-contact span + span::before { content: "·"; margin: 0 5pt; color: #94a3b8; }
.header-rule { border: none; border-top: 1pt solid #e2e8f0; margin: 6pt 0 16pt; }

.letter-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 12pt; margin-bottom: 14pt; }
.letter-meta p { margin: 0; }
.letter-date, .date-line { color: #64748b; white-space: nowrap; }
.letter-subject {
  font-size: 9pt;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8pt;
  color: #0e7490;
  margin-bottom: 12pt;
}

p, ul { margin: 0 0 9pt; }
ul { padding-left: 13pt; }
li { margin-bottom: 3pt; }
li::marker { color: #0e7490; }
.closing { margin-top: 14pt; margin-bottom: 2pt; }
.signature { font-weight: 700; color: #0f172a; }
</style>
</head>
<body></body>
</html>
