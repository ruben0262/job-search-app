<!DOCTYPE html>
<!--
  LEDGER: a cover letter template (libs/templates/README.md). Only the <head> is used; the letter is
  written into the body when it is made. A formal letter in serif under the Ledger CV's centred
  letterhead: the company on the left, then a bold subject. No date: a letter carries none of its
  own (owner, 2026-11-08).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover letter</title>
<style>
@page { size: A4; margin: 20mm 22mm 18mm 22mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Liberation Serif', 'Times New Roman', Times, serif;
  font-size: 11pt;
  color: #111;
  line-height: 1.42;
}

a { color: inherit; text-decoration: none; }

.cv-header { text-align: center; }
.cv-name { font-size: 20pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1pt; line-height: 1.05; }
.cv-contact { font-size: 9.5pt; margin-top: 3pt; display: flex; justify-content: center; }
.cv-contact span + span::before { content: "|"; margin: 0 6pt; color: #666; }
.header-rule { border: none; border-top: 0.75pt solid #111; margin: 6pt 0 16pt; }

.letter-meta { display: flex; flex-direction: column; gap: 10pt; margin-bottom: 14pt; }
.letter-meta p { margin: 0; }
.letter-subject { font-weight: 700; margin-bottom: 12pt; }

p, ul { margin: 0 0 9pt; }
p { text-align: justify; }
ul { padding-left: 15pt; }
li { margin-bottom: 3pt; }
.closing { margin-top: 14pt; margin-bottom: 2pt; text-align: left; }
.signature { font-weight: 700; text-align: left; }
</style>
</head>
<body></body>
</html>
