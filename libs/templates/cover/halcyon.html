<!DOCTYPE html>
<!--
  HALCYON: a cover letter template (libs/templates/README.md). Only the <head> is used; the letter is
  written into the body when it is made. The Halcyon CV's header with its teal bar, over a letter in
  larger type with room between the lines.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover letter</title>
<style>
@page { size: A4; margin: 20mm 22mm 18mm 22mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Lato, 'Liberation Sans', Arial, sans-serif;
  font-size: 11pt;
  color: #1f2933;
  line-height: 1.5;
}

a { color: #0f766e; text-decoration: none; }

.cv-header { border-left: 5pt solid #0f766e; padding-left: 10pt; }
.cv-name { font-size: 24pt; font-weight: 700; color: #134e4a; line-height: 1.1; }
.cv-contact { margin-top: 4pt; font-size: 9.5pt; color: #3e4c59; display: flex; column-gap: 12pt; }
.header-rule { border: none; margin: 0 0 16pt; }

.letter-meta { display: flex; flex-direction: column; gap: 8pt; margin-bottom: 12pt; }
.letter-meta p { margin: 0; }
.letter-subject { font-weight: 700; color: #134e4a; margin-bottom: 12pt; }

p, ul { margin: 0 0 10pt; }
ul { padding-left: 15pt; }
li { margin-bottom: 4pt; }
.closing { margin-top: 14pt; margin-bottom: 2pt; }
.signature { font-weight: 700; color: #134e4a; }
</style>
</head>
<body></body>
</html>
