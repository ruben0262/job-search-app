<!DOCTYPE html>
<!--
  The platform's single CV template. It is DATA, not a document: every marker below is filled
  from the user's confirmed profile by `libs/templates/cv.py`, and the filled result is what the
  tailoring prompt (`libs/prompts/tailor_cv.md`) receives as its BASE TEMPLATE and rewrites for
  one job.

  Markers — all of them are filled, and a section whose data is absent is omitted whole. Named
  here without their comment syntax on purpose: a marker written out in full inside this comment
  would be filled too, and the CV would carry a second copy of the profile in an HTML comment.

    NAME        identity.name
    CONTACT     identity.location + identity.links
    PROFILE     the profile paragraph (the tailoring prompt rewrites it per job)
    SKILLS      skills.*  as Core Competencies
    EXPERIENCE  experience[]
    PROJECTS    projects[]
    EDUCATION   education[]
    LANGUAGES   constraints.languages
    CERTIFICATIONS  certifications[]

  The CSS below is load-bearing and hand-tuned: A4 sizing, the `@page` margin rule that stops
  Chrome drawing its own header over the content, and the `.entry` break rules that keep an entry
  off a page boundary. The tailoring prompt is told CSS is managed externally and must not emit a
  <style> block — the pipeline strips this one before sending and restores it after.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title><!--NAME--> – CV</title>
<style>

/* ---- FONTS ----
   Resolved by name through fontconfig, not by `@font-face` url(). The reference instance shipped
   four url()s relative to the document, which meant every build had to rewrite the path depth to
   match wherever it had written the file — and a wrong depth is silent: Chrome falls back to Arial
   and produces a correct-looking CV in the wrong typeface.

   `deploy/docker/Dockerfile.docgen` installs `fonts-lato` and FAILS THE BUILD if fontconfig cannot
   then see it, so the image cannot ship without the font this asks for. Arial is the fallback for
   a machine with no Lato — a dev box previewing the HTML, never the container that makes PDFs. */

/* ---- PAGE ---- */
@page {
  size: A4;
  /* **The margins live here, not on the body.** Body padding is applied once to the whole flowed
     document, so it puts a gap above page 1 and nothing above page 2 — content starts hard against
     the top edge of every page after the first. `@page` margins repeat on every page, which is what
     a printed document needs and what a recruiter opening page 2 expects to see. */
  margin: 17mm 20mm 16mm 20mm;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Lato', Arial, sans-serif;
  font-size: 10pt;
  color: #222;
  line-height: 1.32;
  padding: 0;
}

a { color: #003399; text-decoration: none; }

/* ---- HEADER ---- */
.cv-header { margin-bottom: 5pt; }

.cv-name {
  font-size: 29pt;
  font-weight: 900;
  color: #003399;
  line-height: 1.0;
  letter-spacing: 0.3pt;
}

.cv-contact {
  font-size: 9pt;
  color: #555;
  margin-top: 4pt;
}

.cv-contact span { margin-right: 10pt; }

.header-rule {
  border: none;
  border-top: 1.5pt solid #003399;
  margin: 6pt 0 7pt 0;
}

/* ---- PROFILE ---- */
.profile {
  font-size: 10pt;
  text-align: justify;
  margin-bottom: 0;
  line-height: 1.35;
}

/* ---- SECTIONS ---- */
.section { margin-top: 7pt; }

.section-title {
  font-size: 10.5pt;
  font-weight: 900;
  color: #003399;
  text-transform: uppercase;
  letter-spacing: 0.3pt;
  border-bottom: 1pt solid #003399;
  padding-bottom: 1.5pt;
  margin-bottom: 4pt;
}

/* ---- COMPETENCIES ---- */
.competencies ul {
  padding-left: 13pt;
  list-style-type: disc;
}

.competencies ul li {
  font-size: 9.5pt;
  margin-bottom: 2.5pt;
  line-height: 1.3;
}

/* ---- EXPERIENCE ENTRIES ---- */
.entry {
  break-inside: avoid;
  page-break-inside: avoid;
  margin-bottom: 4.5pt;
}

.entry-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6pt;
}

.entry-title {
  font-weight: 700;
  font-size: 10pt;
  flex: 1;
  line-height: 1.2;
}

.entry-date {
  font-size: 9pt;
  color: #555;
  white-space: nowrap;
  flex-shrink: 0;
}

.entry-desc {
  font-size: 9.5pt;
  color: #333;
  margin-top: 1.5pt;
  line-height: 1.35;
}

.entry ul {
  padding-left: 13pt;
  list-style-type: disc;
  margin-top: 2pt;
}

.entry ul li {
  font-size: 9.5pt;
  margin-bottom: 1.5pt;
  line-height: 1.3;
}

/* ---- MISC LISTS ---- */
.plain-list {
  padding-left: 13pt;
  list-style-type: disc;
}

.plain-list li {
  font-size: 9.5pt;
  margin-bottom: 2pt;
  line-height: 1.3;
}

</style>
</head>
<body>
<!-- HEADER -->
<div class="cv-header">
  <div class="cv-name"><!--NAME--></div>
  <div class="cv-contact"><!--CONTACT--></div>
</div>
<hr class="header-rule">

<!--PROFILE-->

<!--SKILLS-->

<!--EXPERIENCE-->

<!--PROJECTS-->

<!--EDUCATION-->

<!--LANGUAGES-->

<!--CERTIFICATIONS-->

<div class="section">
  <div class="section-title">References</div>
  <ul class="plain-list">
    <li>Available upon request.</li>
  </ul>
</div>

</body>
</html>
