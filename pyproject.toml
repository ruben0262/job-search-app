# Root tooling config.
#
# Deliberately NOT a distributable package. Services deploy as container images built from their
# own requirements.txt (CODE_STRUCTURE.md §5) — there is nothing here to `pip install`. This file
# exists so the boundary linter, pytest, and ruff have one home instead of four dotfiles.
#
# Python 3.12 is the target: it is what the gateway image is built on (python:3.12-slim), and the
# tree should not depend on a newer interpreter than the thing that actually ships.

# ---------------------------------------------------------------------------------------------
# The rule that prevents spaghetti (CODE_STRUCTURE.md §1).
#
# A rule a linter checks is a rule that survives a late night. A rule in a document is a
# suggestion. `lint-imports` runs in CI on every push.
# ---------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["libs", "services"]

[[tool.importlinter.contracts]]
name = "services may not import each other"
type = "independence"
# Services talk over HTTP or the queue, never by import. The moment services/notifier imports
# services/scorer you have one program in eight folders — independently deployable on paper and
# coupled in practice.
#
# Every service in CODE_STRUCTURE.md §2 is listed here from the start, including ones that are
# still empty packages, so a new service is covered by the contract the moment it has code in it
# rather than whenever someone remembers to add it.
modules = [
    "services.api",
    "services.harvester",
    "services.scorer",
    "services.trainer",
    "services.notifier",
    "services.docgen",
    "services.capture",
    "services.embedder",
]

[[tool.importlinter.contracts]]
name = "libs must not import services"
type = "forbidden"
source_modules = ["libs"]
forbidden_modules = ["services"]

[tool.pytest.ini_options]
# Left permissive on purpose: each component's tests are runnable from its own directory (the
# embedder's README documents `pytest tests/` from services/embedder), and cross-service tests
# live in the root tests/. Naming no `testpaths` keeps both true.
#
# importlib import mode so two test files with the same basename in different components cannot
# collide — inevitable once services/*/tests/ and tests/ both exist.
addopts = "-ra --import-mode=importlib"

# Required, not cosmetic. `python -m pytest` puts the working directory on sys.path; the bare
# `pytest` console script does NOT — and CI invokes the console script. Without this, every test
# importing `libs.*` fails at collection in CI while passing locally, which is the worst possible
# split because local green is exactly what you check before pushing.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
# 110 rather than the more usual 100. The docstrings here carry the *reasoning* behind decisions —
# that is the repo's stated convention — and hard-wrapping prose tighter makes it worse to read and
# worse to edit, which is how explanatory comments start rotting. Code rarely approaches this.
line-length = 110
# Alembic writes these; they are a record of what was applied, not source to be restyled. Editing a
# migration after it has run anywhere is its own hazard, so they are simply out of scope.
extend-exclude = ["libs/db/migrations/versions"]

# Selected explicitly rather than relying on defaults. Ruff's default set changes between releases,
# and a lint job whose rules shift under it produces failures nobody asked for on unrelated commits.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "S", "BLE"]
ignore = [
    "PLR0913",  # many arguments — repository methods legitimately take several keyword-only args
    "PLR2004",  # magic values in tests are the point of the test
    "S101",     # assert: pytest's entire idiom
    # The docstrings in this repo are prose and use en-dashes and arrows deliberately. These rules
    # exist to catch homoglyph attacks in identifiers, which is not what a "—" in a sentence is.
    "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests. Each of these is the idiom, not an oversight.
"tests/*" = [
    "E402",     # imports after pytest.importorskip — which must run first, that is its whole job
    "S106",     # "hardcoded password" in fixtures: placeholder strings, never real credentials
    "S311",     # random: the differential fuzz is seeded and deliberately not cryptographic
    "PLC0415",  # imports inside a test, to keep an optional dependency optional
]
"services/embedder/tests/*" = ["E402", "S106", "PLC0415", "B905", "PLW2901"]
# Lazy module-level singletons behind an accessor. Deliberate: the engine must not be constructed at
# import time, or importing anything would require DATABASE_URL to be set.
"libs/db/session.py" = ["PLW0603"]
"services/embedder/gateway/app.py" = ["PLW0603"]
# services/embedder is built, deployed, and gate-tested. These findings are all deliberate choices
# in that code, and "fixing" them to satisfy a linter added long afterwards would be changing
# working behaviour for style — exactly what CODE_STRUCTURE.md §6 says not to do to this service.
"services/embedder/gateway/dispatcher.py" = ["BLE001"]   # one bare except IS the intent: any
"services/embedder/gateway/verify.py" = ["BLE001"]       #   failure to verify must fail closed
"services/embedder/scripts/*" = [
    "PLR0124",  # `bulk_s == bulk_s` is an intentional NaN check; the comment says so
    "PLW1510",  # subprocess.run without check=: the exit code is inspected explicitly instead
    "S110",     # try/except/pass around best-effort cleanup of a lock file
    "S603", "S607",  # subprocess with a literal argv, no shell — this is the safe form
    "S310",     # urllib on literal http URLs the operator typed; no user input reaches these
    "PLC0415",  # a local import, to keep these runnable with stdlib only on a bare VPS
    "PLR0912", "PLR0915",  # long linear report functions: a checklist reads better unsplit
]
