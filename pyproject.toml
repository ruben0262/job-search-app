# Root tooling config.
#
# Deliberately NOT a distributable package. Services deploy as container images built from their
# own requirements.txt (CODE_STRUCTURE.md §5) — there is nothing here to `pip install`. This file
# exists so the boundary linter, pytest, and ruff have one home instead of four dotfiles.
#
# Python 3.12 is the target: it is what the gateway image is built on (python:3.12-slim), and the
# tree should not depend on a newer interpreter than the thing that actually ships.

# ---------------------------------------------------------------------------------------------
# The rule that prevents spaghetti (CODE_STRUCTURE.md §1).
#
# A rule a linter checks is a rule that survives a late night. A rule in a document is a
# suggestion. `lint-imports` runs in CI on every push.
# ---------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["libs", "services"]

[[tool.importlinter.contracts]]
name = "services may not import each other"
type = "independence"
# Services talk over HTTP or the queue, never by import. The moment services/notifier imports
# services/scorer you have one program in eight folders — independently deployable on paper and
# coupled in practice.
#
# Every service in CODE_STRUCTURE.md §2 is listed here from the start, including ones that are
# still empty packages, so a new service is covered by the contract the moment it has code in it
# rather than whenever someone remembers to add it.
modules = [
    "services.api",
    "services.harvester",
    "services.notifier",
    "services.docgen",
    "services.oauthbroker",
    "services.embedder",
]

[[tool.importlinter.contracts]]
name = "libs must not import services"
type = "forbidden"
source_modules = ["libs"]
forbidden_modules = ["services"]

[tool.pytest.ini_options]
# Left permissive on purpose: each component's tests are runnable from its own directory (the
# embedder's README documents `pytest tests/` from services/embedder), and cross-service tests
# live in the root tests/. Naming no `testpaths` keeps both true.
#
# importlib import mode so two test files with the same basename in different components cannot
# collide — inevitable once services/*/tests/ and tests/ both exist.
addopts = "-ra --import-mode=importlib"

# Required, not cosmetic. `python -m pytest` puts the working directory on sys.path; the bare
# `pytest` console script does NOT — and CI invokes the console script. Without this, every test
# importing `libs.*` fails at collection in CI while passing locally, which is the worst possible
# split because local green is exactly what you check before pushing.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
# 110 rather than the more usual 100. The docstrings here carry the *reasoning* behind decisions —
# that is the repo's stated convention — and hard-wrapping prose tighter makes it worse to read and
# worse to edit, which is how explanatory comments start rotting. Code rarely approaches this.
line-length = 110
# Alembic writes these; they are a record of what was applied, not source to be restyled. Editing a
# migration after it has run anywhere is its own hazard, so they are simply out of scope.
extend-exclude = ["libs/db/migrations/versions"]

# Selected explicitly rather than relying on defaults. Ruff's default set changes between releases,
# and a lint job whose rules shift under it produces failures nobody asked for on unrelated commits.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "S", "BLE"]
ignore = [
    "PLR0913",  # many arguments — repository methods legitimately take several keyword-only args
    "PLR2004",  # magic values in tests are the point of the test
    "S101",     # assert: pytest's entire idiom
    # The docstrings in this repo are prose and use en-dashes and arrows deliberately. These rules
    # exist to catch homoglyph attacks in identifiers, which is not what a "—" in a sentence is.
    "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Operational scripts, run by path on a VPS rather than imported.
"deploy/scripts/*.py" = [
    # The A/B loop is one readable sequence — jobs, variants, build, judge, record — and splitting
    # it to satisfy a statement count would put the thing a reader most wants to follow behind two
    # indirections. One blind except is deliberate: a build that fails for any reason is data about
    # that variant, and losing fifteen paid judgements to the sixteenth is losing what they cost.
    "PLR0915",  # long but linear main()
    "BLE001",   # a failed build is recorded, not propagated
    "E402",     # imports follow the sys.path bootstrap, which has to come first
    "PLC0415",  # a local `import yaml`, so the dependency stays optional for everything else
    "S106",     # "!migrated-no-login" is a sentinel that cannot hash-match, not a password
    # `pg_dump` / `psql`, invoked by backup.py and restore_drill.py. Both run as the operator, on
    # the box, against arguments the operator supplied — there is no untrusted input to inject
    # with, and a caller who can set DATABASE_URL can already run psql directly. Resolving the
    # absolute path would hardcode a distro layout and break on the next Postgres upgrade.
    "S603",     # subprocess with a non-literal argument list
    "S607",     # partial executable path: `pg_dump` and `psql` come from PATH on purpose
    # One f-string builds `SELECT count(*) FROM <table>` from a hardcoded tuple in the same file.
    # There is no user input anywhere near it, and an identifier cannot be a bound parameter.
    "S608",     # SQL built by string formatting
]
# The ported source adapters. ~3,500 lines lifted from the reference instance by
# services/harvester/sources/port_from_reference.py, and deliberately kept diffable against it:
# restyling them to satisfy a linter added years later would destroy the one property that makes
# the port reviewable. The substantive changes (one client factory, defusedxml, per-user lease)
# were made explicitly and are listed in that script.
#
# Note what is NOT ignored here: F841 stays on, and it is what caught the port silently dropping
# RemoteOK's custom User-Agent.
"services/harvester/sources/*.py" = [
    "BLE001",   # a bare `except` per adapter IS the contract: a source must never raise
    "E501",     # long lines in lifted parsing code
    "PLC0415",  # local imports keeping optional source dependencies optional
    "E741",     # single-letter loop variables in the original
    "C408",     # dict() calls in the original
    "S110",     # try/except/pass around best-effort field extraction
    "SIM105",   # ditto, contextlib.suppress would be a rewrite
    "UP017", "UP035", "UP037",  # older typing idioms; changing them is a rewrite, not a port
    "RUF001",   # unicode in job titles and board names
    "PLR0917",  # long positional signatures in the original
    "F401",     # imports the adapters keep for re-export
    "I001",     # import order as the original had it
]
# Salary extraction, recency labels and workplace classification, lifted from the reference
# instance's `pipeline/lib/` on 2026-07-29. Kept byte-identical apart from one seam each: the
# salary bands and the allowed on-site locations are per-user here and were a process-wide config
# file and an env var there.
#
# Every regex, threshold, currency table and bucket edge is the original's. These modules decide
# what a feed card says about money and freshness, and they were arrived at by reading real
# postings — restyling them to satisfy a linter would make the diff against the source unreviewable
# for no gain.
"libs/corpus/salary.py" = [
    "RUF001",   # NBSP and en dashes: they are what real postings contain, and the regexes match them
    "E501",     # long regex lines in the original
    "PLR0911",  # the extractor's early returns, one per currency shape
    "PLC0415",  # local imports as the original had them
    "UP017", "UP035", "UP037",
]
# The posting fetcher, ported from the reference's `scorer/fetch_desc.py` on 2026-07-29.
#
# The blind excepts are the contract, not sloppiness: every function here reaches a third-party page
# over a residential proxy, and the only acceptable failure mode is "no signal" — a job must never
# be dropped from the corpus because a board returned malformed HTML or the proxy timed out. Each
# one either tallies the outcome into `stats` or returns None to a caller that handles it.
"libs/corpus/postings.py" = [
    "BLE001",   # see above: a fetch failure is data, not an exception to propagate
    "S112",     # one JSON-LD block failing to parse means skip it, not abandon the page
]
# The language filter. `langdetect` is imported inside the function and a posting it cannot read
# keeps the job: a filter that raised on malformed text would drop a real job over a parse failure.
#
# **A missing library is no longer part of that bargain.** "only the notifier image carries it" was
# written here and was true; then the code that detects moved to the harvester, the dependency did
# not, and the `ImportError` fell into the same blind `except` as an unreadable posting. Every row
# stored no language and every account's language filter admitted everything, silently, for days.
# `detect_language` now separates the two and logs the missing library once at ERROR.
"libs/corpus/langfilter.py" = ["BLE001", "PLC0415"]
"libs/corpus/timefilter.py" = ["UP017", "UP035", "UP037", "RUF001", "E501"]
"libs/corpus/workfilter.py" = ["UP017", "UP035", "UP037", "RUF001", "E501", "PLR0911"]

# The module-level connection pool. Deliberate: ATS polling opens hundreds of boards per cycle and
# connection reuse is the dominant per-request cost, so one pool is reused across them.
"services/harvester/sources/ats.py" = [
    "BLE001", "E501", "PLC0415", "E741", "C408", "S110", "SIM105",
    "UP017", "UP035", "UP037", "RUF001", "PLR0917", "F401", "I001",
    "PLW0603",
]
# Tests. Each of these is the idiom, not an oversight.
"tests/*" = [
    "E402",     # imports after pytest.importorskip — which must run first, that is its whole job
    "S105",     # ditto for a local named `password`: the auth tests need one to hash
    "S106",     # "hardcoded password" in fixtures: placeholder strings, never real credentials
    "S311",     # random: the differential fuzz is seeded and deliberately not cryptographic
    "PLC0415",  # imports inside a test, to keep an optional dependency optional
]
"services/embedder/tests/*" = ["E402", "S106", "PLC0415", "B905", "PLW2901"]
# FastAPI's dependency-injection idiom IS `Depends()` in an argument default. B008 exists to catch a
# mutable default evaluated once; here that evaluation is the mechanism, and writing it any other
# way would mean not using the framework.
"services/api/*.py" = ["B008"]
# Each status check is a chain of "if this condition holds, say this sentence", and the sentences
# are the point — a reader opens this file to learn what the user is told and when. Collapsing the
# branches behind a lookup to satisfy a return-count would hide exactly that.
"services/api/status_routes.py" = ["B008", "PLR0911"]
# Lazy module-level singletons behind an accessor. Deliberate: the engine must not be constructed at
# import time, or importing anything would require DATABASE_URL to be set.
"libs/db/session.py" = ["PLW0603"]
"services/embedder/gateway/app.py" = ["PLW0603"]
# services/embedder is built, deployed, and gate-tested. These findings are all deliberate choices
# in that code, and "fixing" them to satisfy a linter added long afterwards would be changing
# working behaviour for style — exactly what CODE_STRUCTURE.md §6 says not to do to this service.
"services/embedder/gateway/dispatcher.py" = ["BLE001"]   # one bare except IS the intent: any
"services/embedder/gateway/verify.py" = ["BLE001"]       #   failure to verify must fail closed
"services/embedder/scripts/*" = [
    "PLR0124",  # `bulk_s == bulk_s` is an intentional NaN check; the comment says so
    "PLW1510",  # subprocess.run without check=: the exit code is inspected explicitly instead
    "S110",     # try/except/pass around best-effort cleanup of a lock file
    "S603", "S607",  # subprocess with a literal argv, no shell — this is the safe form
    "S310",     # urllib on literal http URLs the operator typed; no user input reaches these
    "PLC0415",  # a local import, to keep these runnable with stdlib only on a bare VPS
    "PLR0912", "PLR0915",  # long linear report functions: a checklist reads better unsplit
]
