# job-search-embedder — shared embedding service.
#
#   docker network create embedder-net      # once, if not already present
#   docker compose -f deploy/compose.embedder.yml up -d --build
#
# Consumer stacks (job-search, andras-job-search, …) join `embedder-net` as an EXTERNAL network
# and reach the gateway at http://embedder-gateway:8080 — no host ports are published here
# (PLAN network decision: shared Docker network only, auth off). To expose remotely later, add a
# reverse proxy + TLS and set EMBEDDER_AUTH_TOKEN first.

# Pinned so the project name does NOT follow the directory. This file has now moved twice — repo
# root → embedder/ → services/embedder/ — and the containers, volumes, and network survived both
# because of this line. Without it compose derives the project name from the directory, creates a
# fresh (empty) tei-cache volume, re-downloads the model, and renames every container, breaking
# anything that references job-search-app-tei-1 (e.g. scripts/load_rss.py --container).
name: job-search-app

services:
  # HuggingFace Text Embeddings Inference — does the model loading + dynamic (token) batching
  # + length bucketing. One resident copy of the model for everyone. CPU image.
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - "--model-id=${EMBEDDER_MODEL:-BAAI/bge-base-en-v1.5}"
      - "--max-batch-tokens=${TEI_MAX_BATCH_TOKENS:-16384}"
      - "--max-concurrent-requests=${TEI_MAX_CONCURRENT_REQUESTS:-512}"
      # TEI 413s any single call above this. Same env feeds the gateway's chunk size so the two
      # cannot drift apart; the gateway also clamps to whatever /info reports at startup.
      - "--max-client-batch-size=${TEI_MAX_CLIENT_BATCH:-32}"
      - "--auto-truncate"                    # clip over-long inputs instead of erroring
    volumes:
      - tei-cache:/data                      # cache downloaded weights (not re-pulled each boot)
    env_file: [.env]
    networks: [embedder-net]
    restart: always
    # mem_limit is a CEILING, not a target. Measured 2026-07-25: bge-small peaked at 282MB, so the
    # old "<2GB is tight" premise was wrong by ~7x (that figure was the whole scorer-service
    # container, not the embedder) — which is what freed us to standardise on bge-base. Expect
    # roughly 2x small; re-measure with scripts/load_rss.py rather than assuming (PLAN §12).
    mem_limit: 2g
    # CPU is the real constraint, not RAM. bge-base is ~3x the compute of small per text, so this
    # is the knob that decides throughput and score latency under a training flood.
    #
    # Raised 1.5 → 4 on 2026-07-27, and re-measured on the live box on 2026-08-07 against the
    # question "would more cores make the harvest cycle's embed step shorter". They would not:
    #
    #   cpus=4, restarted   64 texts in 23.5-29.0s   367-453 ms/text   (410% CPU during the call)
    #   cpus=6, restarted   64 texts in 24.5-25.0s   383-391 ms/text
    #   two concurrent 64-text calls at cpus=4       526 ms/text, and the slower call waited 67s
    #
    # It already saturates its four cores; the next two buy nothing, and concurrency is 40% *worse*
    # per text. The constraint is the model's compute and memory bandwidth, not the quota, so this
    # number stays at 4 and the box keeps the other four cores for Postgres and Chrome.
    #
    # Capacity at this setting is ~2.7 texts/s, or ~1,700 rows inside the cycle's 11-minute budget,
    # against ~60-100 new rows a cycle in steady state. Long embed passes are backlog, not load.
    cpus: 4
    # ports: ["8081:80"]                     # uncomment ONLY for local debugging of TEI directly

  # Thin gateway: two priority lanes (fast /embed vs bulk /embed/bulk), our /health+version
  # contract, optional bearer auth. Owns no model — forwards to tei.
  embedder-gateway:
    build:
      # Context is the repo root now that this file lives in deploy/ — the gateway
      # imports from libs/, so a context of services/embedder could not see them.
      context: ..
      dockerfile: deploy/docker/Dockerfile.embedder-gateway
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: [.env]
    depends_on: [tei]
    networks: [embedder-net]
    restart: always
    mem_limit: 256m
    cpus: 0.5
    # OPTIONAL, and loopback-only. No consumer uses this — tenants reach the gateway by service
    # name over embedder-net. It exists purely so host-side tooling can talk to the gateway:
    #
    #   needs it : pytest tests/ (EMBEDDER_URL), scripts/load_rss.py, curl /health
    #   does not : scripts/verify_stack.py — falls back to `docker exec` on this container
    #
    # Comment it out if you prefer nothing bound on the host; day-to-day verification still works.
    # 127.0.0.1 is not reachable from the network, so leaving it published exposes nothing beyond
    # processes already on this box. To expose it FURTHER, "0.0.0.0:8080" is not sufficient: set
    # EMBEDDER_AUTH_TOKEN and put TLS in front. An un-authed embedding endpoint is a CPU-DoS magnet.
    ports: ["127.0.0.1:8080:8080"]

networks:
  embedder-net:
    name: embedder-net                       # consumer stacks reference this as `external: true`

volumes:
  tei-cache:
