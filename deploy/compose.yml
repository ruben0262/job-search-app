# The platform stack. Deployed on the VPS; `docker compose up -d` from this directory.
#
# Postgres only, for now. Services join as they are built (PLATFORM_ARCHITECTURE.md §3), and each
# one gets its own Dockerfile under docker/ rather than sharing a base image — that split is what
# lets docgen carry Chrome without making api slow to rebuild (CODE_STRUCTURE.md §5).
#
# services/embedder/ keeps its OWN compose file and is not folded in here. It predates the
# platform, is deployed, and serves the two single-tenant stacks; disturbing it to tidy the tree
# would be a service migration dressed up as a refactor.

name: job-search-platform          # pinned — never let the dir name own the volume

services:
  # The single point of failure, deliberately (PLATFORM_ARCHITECTURE.md §10.3): one datastore for
  # the shared corpus, per-user tail, credentials, and the four-lane job queue. That is what makes
  # account deletion one cascading statement instead of cleanup code someone has to remember to
  # write. The price is that backups and restore drills are not optional — OPERATIONS_PLAN.md §7.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jobsearch
      POSTGRES_USER: jobsearch
      # `:?` so compose REFUSES to start without it. A default password here would work fine right
      # up until it was still there in front of real user credentials.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/.env — see .env.example}
      # WAL level is already 'replica' by default, which is what PITR needs. archive_command gets
      # wired in only when the RPO tightens; nightly dumps alone meet the stated RPO of 24h.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only. Platform services reach Postgres over the compose network by service name and
    # need no mapping at all; this exists for host-side psql and pg_dump. Do NOT change it to
    # 0.0.0.0 — an internet-facing 5432 behind a password is a credential-stuffing target, and the
    # Cloudflare Tunnel (D7) is what remote access goes through instead.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch -d jobsearch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # A ceiling, not a target. The box has 22GB available (PLATFORM_ARCHITECTURE.md §11) but runs
    # NO SWAP, so an unbounded process does not degrade under pressure — the OOM killer picks a
    # victim by size, and Postgres would be the largest thing here. Per-service limits make that
    # choice a decision rather than a coincidence.
    mem_limit: 4g
    # Default is 64m and parallel query workers fail against it with errors that read like disk
    # problems rather than shared-memory exhaustion.
    shm_size: 1g

  # One shared harvest cycle, then exit. Behind the `tools` profile so a bare `up` never starts it:
  # this is a one-shot invoked by a timer, and a `restart: always` one-shot would spin forever.
  # The reference instance's profile split exists for exactly this class of mistake.
  harvester:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.harvester
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      # Reached by service name over embedder-net. Not a host port: the loopback mapping exists for
      # host-side tooling, and depending on it here would couple the harvester to the embedder
      # happening to publish one.
      EMBEDDER_URL: http://embedder-gateway:8080
      # Pinned so a vector-space change is a refusal rather than a silently different space. Must
      # match what services/embedder actually serves.
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-BAAI/bge-base-en-v1.5}
      EMBEDDER_DIM: ${EMBEDDER_DIM:-768}
      # Needed once the per-user LinkedIn loop decrypts proxy credentials (D3). Passed through
      # rather than `:?`-required, so the shared tiers keep harvesting on a box where the key is not
      # set yet — but `libs.secrets` refuses to construct without it, so the LinkedIn loop fails
      # loudly rather than silently skipping.
      SECRETS_KEK: ${SECRETS_KEK:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, embedder-net]
    # A cycle is network-bound and short. The ceiling is a guard against a runaway source, not a
    # target - and the box has 4 GB of swap now, so exceeding it degrades rather than OOM-killing.
    mem_limit: 1g
    cpus: 2

networks:
  # The embedder has its own compose project and owns this network. External, so this stack joins it
  # rather than trying to create it - which would fail, and rightly.
  embedder-net:
    external: true

volumes:
  pgdata:
