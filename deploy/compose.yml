# The platform stack. Deployed on the VPS; `docker compose up -d` from this directory.
#
# Postgres only, for now. Services join as they are built (PLATFORM_ARCHITECTURE.md §3), and each
# one gets its own Dockerfile under docker/ rather than sharing a base image — that split is what
# lets docgen carry Chrome without making api slow to rebuild (CODE_STRUCTURE.md §5).
#
# services/embedder/ keeps its OWN compose file and is not folded in here. It predates the
# platform, is deployed, and serves the two single-tenant stacks; disturbing it to tidy the tree
# would be a service migration dressed up as a refactor.

name: job-search-platform          # pinned — never let the dir name own the volume

services:
  # The single point of failure, deliberately (PLATFORM_ARCHITECTURE.md §10.3): one datastore for
  # the shared corpus, per-user tail, credentials, and the four-lane job queue. That is what makes
  # account deletion one cascading statement instead of cleanup code someone has to remember to
  # write. The price is that backups and restore drills are not optional — OPERATIONS_PLAN.md §7.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jobsearch
      POSTGRES_USER: jobsearch
      # `:?` so compose REFUSES to start without it. A default password here would work fine right
      # up until it was still there in front of real user credentials.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/.env — see .env.example}
      # WAL level is already 'replica' by default, which is what PITR needs. archive_command gets
      # wired in only when the RPO tightens; nightly dumps alone meet the stated RPO of 24h.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only. Platform services reach Postgres over the compose network by service name and
    # need no mapping at all; this exists for host-side psql and pg_dump. Do NOT change it to
    # 0.0.0.0 — an internet-facing 5432 behind a password is a credential-stuffing target, and the
    # Cloudflare Tunnel (D7) is what remote access goes through instead.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch -d jobsearch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # A ceiling, not a target. The box has 22GB available (PLATFORM_ARCHITECTURE.md §11) but runs
    # NO SWAP, so an unbounded process does not degrade under pressure — the OOM killer picks a
    # victim by size, and Postgres would be the largest thing here. Per-service limits make that
    # choice a decision rather than a coincidence.
    mem_limit: 4g
    # Default is 64m and parallel query workers fail against it with errors that read like disk
    # problems rather than shared-memory exhaustion.
    shm_size: 1g

  # One shared harvest cycle, then exit. Behind the `tools` profile so a bare `up` never starts it:
  # this is a one-shot invoked by a timer, and a `restart: always` one-shot would spin forever.
  # The reference instance's profile split exists for exactly this class of mistake.
  harvester:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.harvester
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      # Reached by service name over embedder-net. Not a host port: the loopback mapping exists for
      # host-side tooling, and depending on it here would couple the harvester to the embedder
      # happening to publish one.
      EMBEDDER_URL: http://embedder-gateway:8080
      # Pinned so a vector-space change is a refusal rather than a silently different space. Must
      # match what services/embedder actually serves.
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-BAAI/bge-base-en-v1.5}
      EMBEDDER_DIM: ${EMBEDDER_DIM:-768}
      # Needed once the per-user LinkedIn loop decrypts proxy credentials (D3). Passed through
      # rather than `:?`-required, so the shared tiers keep harvesting on a box where the key is not
      # set yet — but `libs.secrets` refuses to construct without it, so the LinkedIn loop fails
      # loudly rather than silently skipping.
      SECRETS_KEK: ${SECRETS_KEK:-}
      # The platform's own credentials for three free aggregator APIs, not the user's. Adzuna,
      # Jooble and Findwork are general boards — every industry, not only software — which is what
      # makes them worth having: on 2026-08-09 the corpus was 336 ATS companies and every one was a
      # software startup, so a mechanical engineer had 2.9% of the platform to look at.
      #
      # Passed through with `:-` rather than required, because each adapter self-disables when its
      # key is unset and the rest of the harvest carries on. That is also how they were silently
      # doing nothing for weeks: `HARVEST_SOURCES` names twenty, the harvester logged "17 sources
      # enabled", and nothing connected the two numbers.
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      FINDWORK_API_KEY: ${FINDWORK_API_KEY:-}
      # Inside the container; bind-mounted to ./logs on the host below. Without the mount a
      # `compose run --rm` harvest writes its log into a filesystem that is deleted the moment the
      # cycle exits — which is precisely the run you want to read afterwards.
      LOG_DIR: /var/log/jobsearch
      # Where retention writes postings before deleting them (`libs.corpus.archive`). Mounted for
      # the same reason as LOG_DIR and with a sharper consequence: this is a `compose run --rm`, so
      # an unmounted archive is written into a filesystem that is destroyed when the cycle exits —
      # and the rows have already been deleted from Postgres by then. **This mount is the only copy
      # of an archived posting**, so it belongs in whatever gets backed up off the box.
      ARCHIVE_DIR: /var/lib/jobsearch/archive
    volumes:
      - ../logs:/var/log/jobsearch
      - ../archive:/var/lib/jobsearch/archive
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, embedder-net]
    # A cycle is network-bound and short. The ceiling is a guard against a runaway source, not a
    # target - and the box has 4 GB of swap now, so exceeding it degrades rather than OOM-killing.
    mem_limit: 1g
    cpus: 2

  # ── the two lanes that spend a user's Claude credential ─────────────────────────────────────
  #
  # Long-running workers, not one-shots: they claim from their lane, drain the current job on
  # SIGTERM, and are restarted rather than scheduled. Both are `restart: always` precisely because
  # `libs/queue` is built so that a worker killed mid-job costs one retry and never a lost job —
  # restart safety is a design input here, not an incident (CODE_STRUCTURE.md §5).
  #
  # **`SECRETS_KEK` is `:?`-required for both.** Neither can do anything without decrypting the
  # user's credential, so starting without the key would produce a worker that claims jobs, fails
  # every one, and dead-letters a user's queue — a failure that looks like a provider outage.

  # `process` lane. One long Opus call per job over a whole document set; concurrency 1 is plenty
  # because the work is one blocking HTTP request and the cost is the user's, not this box's.
  capture:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.capture
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      SECRETS_KEK: ${SECRETS_KEK:?set it in deploy/.env — the workers cannot decrypt without it}
      LOG_DIR: /var/log/jobsearch
      WORKER_NAME: capture-1
    volumes:
      - ../logs:/var/log/jobsearch
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    # Small: it holds one document set in memory and waits on the network.
    mem_limit: 512m
    cpus: 1

  # `setup` lane. One chat turn, run off the request path so navigating away cannot kill it — the
  # bug this service exists to remove. Streams its reply into the message row as it goes, which is
  # what the page polls.
  setupagent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.setupagent
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      SECRETS_KEK: ${SECRETS_KEK:?set it in deploy/.env — the workers cannot decrypt without it}
      LOG_DIR: /var/log/jobsearch
      WORKER_NAME: setupagent-1
    volumes:
      - ../logs:/var/log/jobsearch
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    # Small: one transcript in memory, waiting on the network for most of the turn.
    mem_limit: 512m
    cpus: 1

  # `label` lane. One Haiku call per job over 50 postings, then it re-enqueues itself — so this is
  # the container that runs longest and most often on a new account.
  labeller:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.labeller
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      SECRETS_KEK: ${SECRETS_KEK:?set it in deploy/.env — the workers cannot decrypt without it}
      LOG_DIR: /var/log/jobsearch
      WORKER_NAME: labeller-1
    volumes:
      - ../logs:/var/log/jobsearch
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    mem_limit: 512m
    cpus: 1

  # ── the rest of the platform ────────────────────────────────────────────────────────────────
  #
  # All under the `full` profile, so a bare `docker compose up -d` still brings up only Postgres
  # and the two credential workers. Starting delivery is a decision — it messages real people —
  # rather than something that happens because somebody typed `up`.
  #
  #     docker compose -f deploy/compose.yml --profile full up -d

  # `score` lane. Free to run: CPU only, no credential, no provider. Turns a harvested row into a
  # score, which nothing else does — without it every feed is frozen at its last manual run.
  scorer:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.scorer
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      MODEL_DIR: /var/lib/jobsearch/models
      LOG_DIR: /var/log/jobsearch
      WORKER_NAME: scorer-1
    volumes:
      - ../logs:/var/log/jobsearch
      # A bind mount, not a named volume, and the reason is that three host-side tools point here.
      # It was `models:` — invisible from the host — so `backup.py --models` silently archived nothing
      # (`if models.is_dir()` was false), `prune_orphaned_artifacts.py` exited "no artifact
      # directory", and `restore_drill.py` reported every active artifact missing. One root cause,
      # three tools quietly doing nothing. `logs` and `archive` were already bind mounts; this makes
      # the third consistent with them.
      - ../models:/var/lib/jobsearch/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    mem_limit: 2g
    cpus: 2

  # `train` lane. Concurrency 1 and CPU-fenced in the image as well as here: one fit can saturate
  # every core through BLAS threading, and the thread caps only take effect before numpy imports.
  trainer:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.trainer
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      MODEL_DIR: /var/lib/jobsearch/models
      LOG_DIR: /var/log/jobsearch
      WORKER_NAME: trainer-1
    volumes:
      - ../logs:/var/log/jobsearch
      # A bind mount, not a named volume, and the reason is that three host-side tools point here.
      # It was `models:` — invisible from the host — so `backup.py --models` silently archived nothing
      # (`if models.is_dir()` was false), `prune_orphaned_artifacts.py` exited "no artifact
      # directory", and `restore_drill.py` reported every active artifact missing. One root cause,
      # three tools quietly doing nothing. `logs` and `archive` were already bind mounts; this makes
      # the third consistent with them.
      - ../models:/var/lib/jobsearch/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    mem_limit: 3g
    cpus: 2

  # `docgen` lane. **The only container with a browser in it** (CODE_STRUCTURE.md §5): a build is
  # two Claude calls and two Chrome compiles, ~90–130 s, on the user's own credential.
  #
  # `mem_limit` is the point of the isolation, not a formality. Chrome is spiky and this box has
  # already had one memory incident; bounded here, a bad build dies alone instead of taking the API
  # with it. It is also why a failed compile RETRIES rather than dead-lettering — the usual cause is
  # a busy box, and the next attempt succeeds.
  #
  # No volumes. Generated documents are ephemeral (D9): a scratch directory inside the container for
  # the length of one upload, removed in a `finally`, so a restart cannot leave a stranger's CV on
  # this disk.
  docgen:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.docgen
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      SECRETS_KEK: ${SECRETS_KEK:?docgen decrypts the user's Claude credential and bot token}
      LOG_DIR: /var/log/jobsearch
      WORKER_NAME: docgen-1
    volumes:
      - ../logs:/var/log/jobsearch
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    mem_limit: 1500m
    cpus: 2

  # `notify` lane. **This is the one that messages real people**, which is why the whole group is
  # behind a profile rather than started by default.
  notifier:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.notifier
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      SECRETS_KEK: ${SECRETS_KEK:?the notifier decrypts each user's bot token}
      LOG_DIR: /var/log/jobsearch
      WORKER_NAME: notifier-1
    volumes:
      - ../logs:/var/log/jobsearch
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    mem_limit: 512m
    cpus: 1

  # The web API. **No published port**: it is reached through the Cloudflare Tunnel (D7), so the
  # VPS needs no open inbound port and there is nothing on the internet to portscan.
  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    profiles: ["full"]
    networks:
      default:
        aliases:
          # **This box runs a second application whose API container is also called `api` and also
          # listens on 8000**, in its own compose project and its own network. Both tunnels are
          # therefore configured with the byte-identical origin `http://api:8000`, and the only
          # thing keeping them apart is that each `cloudflared` is attached to exactly one network.
          # That is isolation by luck: attach either tunnel to a second network — which joining
          # `embedder-net` would do — and `api` becomes ambiguous, with Docker's DNS choosing.
          #
          # `platform-api` cannot collide. Point the tunnel's origin at it and the routing stops
          # depending on network membership. The `api` name stays as well, so every in-network
          # caller keeps working and the two names can be switched over independently.
          - platform-api
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:${POSTGRES_PASSWORD:?}@postgres:5432/jobsearch
      SECRETS_KEK: ${SECRETS_KEK:?the API writes the credential store}
      # Same rule: the API refuses to start without it, loudly, from its own code.
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # **Every emailed link is built from this.** Absent, `_base_url` falls back to
      # `http://localhost:8000` and every verification and reset mail sends the user to their own
      # machine — which is what happened in production until 2026-07-30: the variable was in
      # `.env.example` and in nothing that reads it. Required, because a silently wrong link is
      # worse than a container that refuses to start.
      PUBLIC_URL: ${PUBLIC_URL:?the verification and reset emails are built from it}
      LOG_DIR: /var/log/jobsearch
    volumes:
      - ../logs:/var/log/jobsearch
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    mem_limit: 1g
    cpus: 2

  # Claude sign-in sessions. **Exactly one replica, and that is a correctness constraint, not a
  # sizing one**: `claude setup-token` blocks on stdin between the request that hands the user a URL
  # and the request that brings the code back, so both must reach the same process. A second replica
  # would answer for sessions it has never heard of and tell users their sign-in expired.
  #
  # That constraint used to sit inside the API, where it silently capped the API at one worker.
  # Moving it here is what lets the API scale.
  #
  # No ports published: it authenticates nobody and takes a user id as an argument, so it is
  # reachable on the compose network and nowhere else. The API is the thing that authenticates.
  oauthbroker:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.oauthbroker
    profiles: ["full"]
    environment:
      LOG_DIR: /var/log/jobsearch
    volumes:
      - ../logs:/var/log/jobsearch
    restart: always
    # Small: it holds pty file descriptors and a dict. The ceiling that matters is
    # `MAX_LIVE_SESSIONS`, not memory.
    mem_limit: 512m
    cpus: 1

  # The only way in. **The VPS has no open inbound port** — cloudflared makes an outbound connection
  # to Cloudflare and traffic arrives back down it (D7), so there is nothing on this box to
  # portscan and no certificate to renew.
  #
  # Token-based, matching the tunnel already running on this host for another project: the token
  # encodes which tunnel this is, and the public hostname to `api:8000` mapping is configured in
  # the Cloudflare dashboard rather than in a file here. That split is worth knowing when something
  # is unreachable — half the configuration is not in this repository.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    profiles: ["full"]
    environment:
      # `:-` and not `:?`, deliberately. Compose interpolates **every** service in the file on every
      # command, so a `:?` here makes `up scorer` fail with a message about a tunnel — which it did,
      # twice, before this comment existed. The rule now: `:?` only where absence is *silently*
      # dangerous (a worker that starts without `SECRETS_KEK` dead-letters every job it claims), and
      # `:-` where the process fails loudly on its own. cloudflared exits immediately, saying so,
      # when handed an empty token.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 256m

networks:
  # The embedder has its own compose project and owns this network. External, so this stack joins it
  # rather than trying to create it - which would fail, and rightly.
  embedder-net:
    external: true

volumes:
  pgdata:
  # `models:` was here. It is a bind mount now (`../models`), because three host-side tools read that
  # directory — the backup, the orphan pruner and the restore drill — and a named volume is invisible
  # to all three. They were not failing; they were silently finding nothing.
