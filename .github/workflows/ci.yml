# CI: the gates of CLAUDE.md §7, on a clean machine.
#
# **Switched off for now (owner, 2026-11-26): it starts only when somebody starts it by hand.** Nothing runs
# on a push or a pull request, so it spends none of the account's Actions minutes. To run it once: the
# Actions tab, "ci", "Run workflow". To switch it back on, give `on:` its `push` and `pull_request` again.
#
# What it runs is `scripts/gates.sh --all`, the same file a commit is checked with locally. Before that
# this workflow kept a list of its own, and by the time it was looked at again it asked for a Postgres, ran
# Alembic and imported five services that had been gone for a month. One list cannot drift from itself.
#
# Python 3.12 is what every image is built on (`python:3.12-slim`).
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: the gates, all of them
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # A real MongoDB at the version the platform runs: the schema's rules and indexes are the database's
      # own, and a stand-in would prove nothing about them. Every run works in databases of its own.
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      # A hosted runner has two cores for a private repository. Four workers, each with a Chromium and a
      # server, would wait on each other there, and a browser test gives a page five seconds.
      GATES_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # At the versions the images are built with (`scripts/pin_runtime.py`), not whatever is newest today:
      # a fresh install took newer ones, and the test that holds the two together failed for it.
      - run: pip install -c deploy/docker/constraints.txt -r requirements-dev.txt
      - run: npm ci
        working-directory: web
      # The faces the docgen image installs (`deploy/docker/Dockerfile.docgen`). Chrome falls back to
      # another face without a word, and the tests of each look read the face out of the PDF.
      - name: the fonts the documents are set in
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fontconfig
          fonts-lato fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core
      # The Chromium this Playwright was made for, and where it is, so no browser test skips.
      - name: a Chromium for the browser tests
        run: |
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright as p; b = p().start(); print('CHROME_BIN=' + b.chromium.executable_path); b.stop()" >> "$GITHUB_ENV"
      - run: scripts/gates.sh --all

  # Each service's declared dependencies are installed **alone**, as its image installs them, then its entry
  # point is imported.
  #
  # This exists because the same bug shipped twice: `httpx` missing from `api`, then `cryptography` missing
  # from two others. Both are reached indirectly, so a development environment that has everything installed
  # cannot see the gap, and the failure lands as a container that will not start.
  #
  # One job with a venv per service, not a job per service: the isolation is kept, and GitHub rounds every
  # job up to the minute. Failures are collected and reported together: one service's missing dependency
  # should not hide another's.
  service-deps:
    name: every service starts from its own requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: each service, alone, in an empty environment
        run: |
          set -uo pipefail
          failed=""
          while read -r service module pins; do
            [ -z "$service" ] && continue
            echo "::group::$service"
            rm -rf /tmp/venv
            python -m venv /tmp/venv
            # shellcheck disable=SC2086 - $pins is two words or none
            if ! /tmp/venv/bin/pip install -q $pins -r "services/$service/requirements.txt"; then
              echo "::error::$service: its requirements do not install"
              failed="$failed $service"
              echo "::endgroup::"
              continue
            fi
            # The environment a container would have: nothing set but the one secret the API reads as it is
            # imported, because a missing variable must fail loudly at use and not at import.
            if ! ACCESS_TOKEN_SECRET="ci-import-check-$service-xxxxxxxxxxxxxxxxxxxx" \
                 /tmp/venv/bin/python -c "import $module"; then
              echo "::error::$service: $module does not import from its own requirements"
              failed="$failed $service"
            fi
            echo "::endgroup::"
          done <<'SERVICES'
          api services.api.app -c deploy/docker/constraints.txt
          docgen services.docgen.__main__ -c deploy/docker/constraints.txt
          harvester services.harvester.__main__ -c deploy/docker/constraints.txt
          notifier services.notifier.__main__ -c deploy/docker/constraints.txt
          oauthbroker services.oauthbroker.__main__
          SERVICES
          if [ -n "$failed" ]; then
            echo "::error::these services cannot start from their own requirements:$failed"
            exit 1
          fi

  # Secret leakage. The whole history is scanned, because a key that was committed and then removed is still
  # in every clone: the removal commit is where people stop looking and the history is where the key still
  # lives. This platform holds other people's AI accounts and proxy credentials, so the bar is "a leaked
  # credential never reaches the remote", not "we would probably notice". Local-only files (`certificates/`)
  # are gitignored; this job is the backstop for the day one of them is added with -f.
  secrets:
    name: secret leakage scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
