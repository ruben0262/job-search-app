# CI — boundary contracts and the tests that need no live stack.
#
# Wired on the first commit of the platform layout, deliberately: import boundaries are trivial to
# establish now and painful to retrofit once eight services import each other
# (CODE_STRUCTURE.md §1, ROADMAP.md Phase 1 step 0a).
#
# Python 3.12 matches the gateway image (python:3.12-slim). CI should not be the only place the
# tree runs on a different interpreter than production.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundaries:
    name: import boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Contracts live in pyproject.toml: services may not import each other, libs may not import
      # services. Failing here is the point — a violation is cheap to fix the day it is written.
      - run: lint-imports --verbose
      # Added 2026-07-27, after noticing ruff had only ever been run by hand — which means it was
      # only ever run on the files someone remembered to name. Rules are pinned explicitly in
      # pyproject.toml so a ruff release cannot fail an unrelated commit.
      - run: ruff check .

  schema:
    name: migrations + schema invariants
    runs-on: ubuntu-latest
    services:
      # A real Postgres, not SQLite. The schema depends on things SQLite does not have — partial
      # unique indexes, JSONB, TIMESTAMPTZ, ON DELETE RESTRICT — so testing against a stand-in would
      # prove nothing about what actually runs.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jobsearch
          POSTGRES_USER: jobsearch
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U jobsearch" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+psycopg://jobsearch:ci@127.0.0.1:5432/jobsearch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Migrations run as their own step here for the same reason they do in production: this also
      # proves `alembic upgrade head` works from an empty database, every time.
      - run: alembic upgrade head
      # Autogenerate against the just-migrated database must produce nothing. A non-empty diff means
      # someone changed a model without writing the migration, which is only otherwise discovered
      # when a deploy fails.
      - name: models and migrations agree
        # Every failure mode below is checked explicitly, because two earlier versions of this step
        # reported success while checking nothing:
        #
        #   1. It globbed for `*drift-check*.py`, which Alembic never writes — `file_template`
        #      slugifies the hyphen to `drift_check`. grep errored, `if` read that as false, pass.
        #   2. Rewritten with `set -e`, a failed `generated=$(ls …)` assignment still did not abort,
        #      so an Alembic error (e.g. "target database is not up to date") also passed.
        #
        # A drift check that cannot fail is worse than none, because it is also reassuring. So:
        # assert Alembic succeeded, assert a file appeared, and only then inspect it.
        run: |
          set -uo pipefail
          if ! alembic revision --autogenerate -m driftcheck; then
            echo "::error::alembic autogenerate failed — see output above"
            exit 1
          fi
          generated=$(ls libs/db/migrations/versions/*driftcheck*.py 2>/dev/null || true)
          if [ -z "$generated" ]; then
            echo "::error::autogenerate reported success but wrote no file — check file_template"
            exit 1
          fi
          if grep -qE '^\s+op\.' "$generated"; then
            echo "::error::models drifted from migrations — run 'alembic revision --autogenerate'"
            cat "$generated"
            rm -f "$generated"
            exit 1
          fi
          rm -f "$generated"
          echo "no drift: models and migrations agree"
      - run: pytest tests/ -v

  embedder-tests:
    name: embedder (no live stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/embedder/tests/requirements.txt
      # EMBEDDER_URL is deliberately unset: the integration tier (health shape, batch invariance,
      # priority lane, parity) needs a running TEI backend and stays a VPS-side gate. What runs
      # here is the tier that needs nothing — the gateway against a stubbed TEI, and fail-closed
      # behaviour when the backend is dead.
      - run: pytest services/embedder/tests -v

  web:
    name: web (types match the API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r services/api/requirements.txt
      - run: npm ci
        working-directory: web

      # The check `web/README.md` promised: the committed schema and types are regenerated and
      # diffed. An unexpected diff means somebody changed a response shape without meaning to —
      # which is exactly the change that otherwise surfaces as a runtime `undefined` in front of a
      # user, weeks later, with nothing pointing back at the commit that caused it.
      - name: the committed API contract is current
        run: |
          python web/scripts/dump_openapi.py
          npx openapi-typescript openapi.json -o src/api-types.ts
          if ! git diff --exit-code -- openapi.json src/api-types.ts; then
            echo "::error::the API changed but the generated contract was not regenerated — run 'npm run types' in web/"
            exit 1
          fi
        working-directory: web

      # tsc runs first inside `build`, so a component reading a field the API does not return is a
      # compile error here rather than a blank panel in production.
      - run: npm run build
        working-directory: web
