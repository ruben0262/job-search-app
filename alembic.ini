# Alembic, wired from the first table (GAPS_REVIEW G5). No hand-applied DDL, ever — a schema whose
# history is partly in migrations and partly in someone's psql session cannot be rebuilt, and the day
# that matters is the day of a restore.
#
#   alembic revision --autogenerate -m "what changed"
#   alembic upgrade head
#
# `sqlalchemy.url` is deliberately absent: env.py reads DATABASE_URL instead, so a connection string
# with a password never lands in a tracked file.
#
# ⚠ `alembic upgrade head` runs as its OWN one-shot step, never from a service entrypoint. Two
# services racing to migrate on restart is a real outage (CODE_STRUCTURE.md §5). Schema changes are
# additive-first — add column, deploy code, backfill, drop later — so old and new code can both run
# against the same database during a rollout.

[alembic]
script_location = libs/db/migrations
prepend_sys_path = .
# No `path_separator` / `version_path_separator` here on purpose. The option only matters with
# MULTIPLE version directories, which this project does not have, and its name changed across
# Alembic releases — setting it pins us to a version range for no benefit and fails confusingly on
# the other side of that range.

# Migration filenames sort chronologically, which makes `ls versions/` a readable history rather
# than a pile of random hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
